name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write, actions: read }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (app files only)
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js icons _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    # separate job: the artifact is fully registered before deploy-pages looks it up
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
